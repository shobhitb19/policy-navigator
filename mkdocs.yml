site_name: Place-Based Policy Wiki
site_description: A RAG-first knowledge base on urban economics and place-based policy
site_author: Richard Walley
repo_url: https://github.com/richardfwalley/llm-place-based-policy
repo_name: richardfwalley/llm-place-based-policy

docs_dir: _wiki
site_dir: _site

theme:
  name: material
  features:
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - def_list
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

